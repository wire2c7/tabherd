# prek (https://github.com/j178/prek) で実行する。ツールはNix devShellから供給されるため language: system を使う
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-json5
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: treefmt
        name: treefmt
        entry: treefmt --fail-on-change --no-cache
        language: system
        pass_filenames: true
        # commit-msg の段階ではメッセージのファイルが渡される。git worktree ではそれがツリーの外（共通の .git/worktrees/）にあり、treefmt がエラーになる
        stages: [pre-commit]

      # oxfmt / oxlint は package.json で管理するため pnpm exec で呼ぶ（node_modules が無ければ pnpm が先にインストールする）。
      # 複数プロセスで同時に実行されると自動インストールが競合するため、require_serial で1プロセスに限る
      - id: oxfmt
        name: oxfmt
        entry: pnpm exec oxfmt --no-error-on-unmatched-pattern
        language: system
        require_serial: true
        files: \.(c|m)?[jt]sx?$|\.jsonc?$|\.json5$|\.ya?ml$|\.html$|\.css$

      - id: oxlint
        name: oxlint
        entry: pnpm exec oxlint --deny-warnings
        language: system
        require_serial: true
        files: \.(c|m)?[jt]sx?$

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: betterleaks
        name: betterleaks
        entry: betterleaks git --staged --no-banner --redact
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: commitlint
        name: commitlint
        entry: commitlint --edit
        language: system
        stages: [commit-msg]
