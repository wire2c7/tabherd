name: 機能要望
description: 新機能や改善を提案する
labels: [enhancement]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景・現状
      description: なぜ必要か、今どうなっているか
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: やること
      description: 1つの変更を1行で書く。1つの PR で閉じられない量になるなら、親 Issue にして子 Issue（Sub-issue）に分ける
      placeholder: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受入条件
      description: 何をもって完了とするかを、観測できる条件で書く
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 関連
      description: 関連する Issue・PR・Spec（openspec/）・ADR（docs/adr/）
