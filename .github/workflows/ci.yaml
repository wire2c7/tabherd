name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: wire2c7/workflows/.github/workflows/nix-ci.yaml@3c49686fb929d3427e0abad5a4ed214defb0b903 # v1.0.0

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: pnpm install
        run: nix develop --command pnpm install --frozen-lockfile

      - name: format check
        run: nix develop --command pnpm fmt:check

      - name: lint
        run: nix develop --command pnpm lint

      - name: typecheck
        run: nix develop --command pnpm typecheck

      - name: test
        run: nix develop --command pnpm test

      - name: build
        run: nix develop --command pnpm build

  # 拡張機能を読み込んだ Chromium での E2E テスト。Chromium を取得する分重いため、build ジョブと分ける
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: pnpm install
        run: nix develop .#e2e --command pnpm install --frozen-lockfile

      - name: e2e
        run: nix develop .#e2e --command pnpm e2e

      - name: upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          # 失敗の調査に使うだけなので、既定の 90 日より短くする
          retention-days: 7
