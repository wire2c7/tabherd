name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: wire2c7/workflows/.github/workflows/nix-ci.yaml@3c49686fb929d3427e0abad5a4ed214defb0b903 # v1.0.0

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: pnpm install
        run: nix develop --command pnpm install --frozen-lockfile

      - name: format check
        run: nix develop --command pnpm fmt:check

      - name: lint
        run: nix develop --command pnpm lint

      - name: typecheck
        run: nix develop --command pnpm typecheck

      - name: test
        run: nix develop --command pnpm test

      - name: build
        run: nix develop --command pnpm build

  # 拡張機能を読み込んだ Chromium での E2E テスト。Chromium を取得する分重いため、build ジョブと分ける
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: pnpm install
        run: nix develop .#e2e --command pnpm install --frozen-lockfile

      - name: e2e
        run: nix develop .#e2e --command pnpm e2e

      - name: upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          # 失敗の調査に使うだけなので、既定の 90 日より短くする
          retention-days: 7
